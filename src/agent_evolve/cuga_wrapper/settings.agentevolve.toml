# AgentEvolve's CUGA per-agent model settings, selected by the wrapper's
# RuntimeSettings.configure_cuga_environment() when AGENT_SETTING_CONFIG is
# unset. Modeled on cuga's shipped settings.openai.toml (the wrapper configures
# CUGA's documented OpenAI mode) with ONE deliberate divergence:
#
#   agent.action.model.max_tokens = 100000 and timeout = 900, not 400/none.
#
# The shipped profile caps the action agent at 400 tokens. Our endpoint serves
# a reasoning model that burns completion tokens on reasoning before emitting
# content; measured worst case for a single rich call on this project is 4281
# completion tokens (?08 audit, live probe). A 400-token budget starves the
# tool-calling loop silently -- empty answers, no error.
#
# 2026-08-25: ALL agents raised 16000 -> 100000 by user directive ahead of
# complex multi-tool live runs; the endpoint ACCEPTED max_tokens=100000 on a
# live probe (finish_reason=stop, trivial burn - a cap is a ceiling, not a
# target; terminal_output/live-run-prep/token-cap-probe.log). If you tune
# these values downward, stay >= 8000 (~2x the measured worst case);
# tests/test_token_budget_audit.py pins that floor.
#
# Explicit user override wins: set AGENT_SETTING_CONFIG to any other profile.

[agent.task_decomposition.model]
platform = "openai"
temperature = 0.1
max_tokens = 100000
timeout = 900

[agent.planner.model]
platform = "openai"
temperature = 0.1
max_tokens = 100000
timeout = 900

