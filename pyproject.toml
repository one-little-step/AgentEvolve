[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evolve"
version = "0.1.0"
description = "Agent-neutral RHO-Parallel-GEPA evolution framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cuga>=0.3.1",
    "numpy>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
cuga = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
